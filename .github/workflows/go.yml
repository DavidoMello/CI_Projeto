name: Go CI

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

jobs:

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04

        go_version:
          - '1.18'
          - '1.21'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Show versions
        run: |
          go version
          docker --version
          docker compose version

      - name: Build DB
        run: docker compose build

      - name: Start DB
        run: docker compose up -d

      - name: Wait DB
        run: sleep 10

      - name: Run Tests
        run: go test -v ./...

      - name: Stop Containers
        if: always()
        run: docker compose down

  build:
    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: go build -v ./...
