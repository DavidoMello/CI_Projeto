name: Go CI

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

jobs:

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04

        go_version:
          - '1.17'
          - '1.18'
          - '1.21'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go_version }}

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build DB
        run: docker-compose build

      - name: Create DB
        run: docker-compose up -d

      - name: Run Tests
        run: go test -v ./...

  build:
    needs: test

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build Application
        run: go build -v main.go
