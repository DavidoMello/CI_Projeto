name: Go CI

on:
  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        go_version:
          - '1.18'
          - '1.21'

    services:

      postgres:
        image: postgres:15

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Wait Database
        run: sleep 10

      - name: Install Dependencies
        run: go mod tidy

      - name: Run Tests
        run: go test -v ./...
